[pytest]
# ../frontend/tests holds test_types_mirror.py: types.ts must mirror app/models.py field for
# field, so a plain `pytest` here also catches drift between the two hand-written contracts.
testpaths = tests ../frontend/tests
filterwarnings =
    # Starlette's TestClient nags about httpx2; the app itself does not use the TestClient.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
